<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>クイズ 司会者用</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:22px;font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;background:#0f1b33;color:#fff}
.w{max-width:1100px;margin:auto}
.hd{display:flex;justify-content:space-between;align-items:baseline}
h1{margin:0;font-size:1.8rem}#st{font-size:1.4rem;font-weight:700;color:#f2b01e}
#lobby{text-align:center;padding:20px}#qr{background:#fff;padding:14px;display:inline-block;border-radius:16px}
#url{font-size:1.1rem;opacity:.8;word-break:break-all}.mid{font-size:2rem;font-weight:800}
.bar{height:16px;border-radius:9px;background:#26365a;margin:14px 0;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#f2b01e;transition:width .25s linear}
#q{font-size:2.6rem;font-weight:900;line-height:1.4;margin:16px 0}
#ch{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.t{display:flex;gap:16px;align-items:center;min-height:110px;padding:18px;border-radius:20px;font-size:2rem;font-weight:800}
.t b{flex:none;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.28);display:grid;place-items:center}
.dim{opacity:.25}.c0{background:#c8433f}.c1{background:#2f5fa8}.c2{background:#b98512}.c3{background:#2f8a52}
#fin h2{font-size:2.4rem}.row{display:flex;gap:24px;font-size:2rem;font-weight:800;padding:10px 16px;background:#1a2a4d;border-radius:14px;margin:8px 0}.row span:nth-child(2){flex:1}
.ctl{margin-top:22px}button{font:inherit;font-size:1.3rem;font-weight:800;padding:14px 30px;border:0;border-radius:14px;background:#2f5fa8;color:#fff}
#rs{background:#4a5675;font-size:1rem;margin-left:12px}
@media(max-width:700px){#ch{grid-template-columns:1fr}#q{font-size:1.8rem}}
</style></head><body><div class="w">
<div class="hd"><h1>クイズ大会</h1><span id="st"></span></div>
<div id="lobby"><div id="qr"></div><p id="url"></p><p class="mid">QRコードを読み取って参加しよう!</p></div>
<div id="play" style="display:none"><div class="bar"><i id="bar"></i></div><div id="q"></div><div id="ch"></div></div>
<div id="fin" style="display:none"></div>
<div class="ctl"><button id="main"></button><button id="rs">最初からやり直す</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getDatabase,ref,set,remove,onValue,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const cfg={apiKey:"AIzaSyD4hOMWOfEy-RmuIMYCH8fI3tXvNijKjgI",authDomain:"quiz-competition-f04d6.firebaseapp.com",databaseURL:"https://quiz-competition-f04d6-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"quiz-competition-f04d6",appId:"1:272062892984:web:359306a22f7cb27de25d4d"};
// ▼ 問題はここだけ書き換える(c=選択肢4つ、a=正解の番号 0〜3)
const LIMIT=30;
const Q=[
{t:"テスト問題1:日本の首都は?",c:["東京","大阪","京都","名古屋"],a:0},
{t:"テスト問題2:1週間は何日?",c:["5日","6日","7日","8日"],a:2},
{t:"テスト問題3:空の色(晴れの日)は?",c:["赤","青","緑","黒"],a:1},
{t:"テスト問題4:1年は何か月?",c:["10","11","12","13"],a:2},
{t:"テスト問題5:犬の鳴き声は?",c:["にゃー","わん","ぶー","こけこっこー"],a:1},
{t:"テスト問題6:3+4は?",c:["6","7","8","9"],a:1},
{t:"テスト問題7:一番大きな海は?",c:["太平洋","大西洋","インド洋","北極海"],a:0},
{t:"テスト問題8:富士山があるのは?",c:["北海道","静岡・山梨","沖縄","福岡"],a:1},
{t:"テスト問題9:信号の「進め」の色は?",c:["赤","黄","青(緑)","白"],a:2},
{t:"テスト問題10:サッカーのチーム人数は?",c:["9人","10人","11人","12人"],a:2}];
// 全問正解・最速で TOTAL ポイント(満点)。1問あたり TOTAL÷問題数
const TOTAL=100,PER=TOTAL/Q.length;
const db=getDatabase(initializeApp(cfg)),$=i=>document.getElementById(i);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let g={phase:"lobby"},pl={},ans={},off=0;
const url=location.href.replace(/host\.html.*$/,"player.html");
$("url").textContent=url;new QRCode($("qr"),{text:url,width:240,height:240});
onValue(ref(db,".info/serverTimeOffset"),s=>off=s.val()||0);
onValue(ref(db,"game"),s=>{g=s.val()||{phase:"lobby"};ui()});
onValue(ref(db,"players"),s=>{pl=s.val()||{};ui()});
onValue(ref(db,"answers"),s=>{ans=s.val()||{};ui()});
async function next(){
 const q=(g.q??-1)+1;if(q>=Q.length)return set(ref(db,"game"),{...g,phase:"final"});
 await set(ref(db,"game"),{phase:"question",q,n:Q.length,startedAt:serverTimestamp(),limit:LIMIT,question:{text:Q[q].t,choices:Q[q].c},board:g.board||[]});
 setTimeout(()=>{if(g.q===q&&g.phase==="question")reveal()},LIMIT*1000+1500);
}
async function reveal(){
 const q=g.q,A=ans[q]||{},prev={};(g.board||[]).forEach(b=>prev[b.id]=b);
 const rows=Object.keys(pl).map(id=>{
  const p=prev[id]||{total:0,ok:0,ms:0},a=A[id];let gain=0,hit=false,ms=0;
  if(a){ms=Math.max(0,a.at-g.startedAt);hit=a.c===Q[q].a&&ms<=g.limit*1000+1500;
   if(hit)gain=Math.round(PER*(1-Math.min(ms/(g.limit*1000),1)/2)*10)/10}
  return{id,name:pl[id].name,total:Math.round((p.total+gain)*10)/10,ok:p.ok+(hit?1:0),ms:p.ms+(hit?ms:0),gain,hit};
 }).sort((x,y)=>y.total-x.total||x.ms-y.ms);
 await set(ref(db,"game"),{...g,phase:"reveal",correct:Q[q].a,board:rows});
}
async function reset(){await remove(ref(db,"answers"));await remove(ref(db,"players"));await set(ref(db,"game"),{phase:"lobby"})}
setInterval(()=>{$("bar").style.width=g.phase==="question"?Math.max(0,100*(1-(Date.now()+off-g.startedAt)/(g.limit*1000)))+"%":"0"},250);
$("rs").onclick=()=>{if(confirm("参加者・回答・得点をすべて消して、最初に戻します。よろしいですか?"))reset()};
function ui(){
 const ph=g.phase,n=Object.keys(pl).length,got=ph==="question"?Object.keys(ans[g.q]||{}).length:0;
 $("st").textContent="参加者 "+n+"人"+(ph==="question"?" / 回答済み "+got+"人":"");
 $("lobby").style.display=ph==="lobby"?"":"none";
 $("play").style.display=ph==="question"||ph==="reveal"?"":"none";
 $("fin").style.display=ph==="final"?"":"none";
 if(g.question){$("q").textContent=(g.q+1)+"/"+Q.length+"  "+g.question.text;
  $("ch").innerHTML=g.question.choices.map((c,i)=>'<div class="t c'+i+(ph==="reveal"&&i!==g.correct?" dim":"")+'"><b>'+"ABCD"[i]+"</b>"+esc(c)+"</div>").join("")}
 if(ph==="final")$("fin").innerHTML="<h2>最終結果</h2>"+(g.board||[]).slice(0,10).map((b,i)=>'<div class="row"><span>'+(i+1)+"位</span><span>"+esc(b.name)+"</span><span>"+b.total+"ポイント</span><span>正解"+b.ok+"問</span></div>").join("");
 const last=g.q===Q.length-1,m=$("main");
 const [label,fn]={lobby:["クイズ開始",next],question:["正解発表",reveal],reveal:[last?"最終結果":"次の問題へ",next],final:["最初からやり直す",reset]}[ph];
 m.textContent=label;m.onclick=fn;
}
ui();
</script></body></html>
