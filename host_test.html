<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>チーム戦クイズ 司会者用(テスト用)</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:22px;font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;background:#0f1b33;color:#fff}
.w{max-width:1100px;margin:auto}
.hd{display:flex;justify-content:space-between;align-items:baseline}
h1{margin:0;font-size:1.8rem}#st,#el{font-size:1.4rem;font-weight:700;color:#f2b01e}
#lobby{text-align:center;padding:20px}#qr{background:#fff;padding:14px;display:inline-block;border-radius:16px}
#url{font-size:1.1rem;opacity:.8;word-break:break-all}.mid{font-size:2rem;font-weight:800}
.chip{display:inline-block;margin:6px;padding:8px 18px;border-radius:99px;background:var(--tc);font-size:1.4rem;font-weight:800}
#goal{font-size:1.6rem;font-weight:800;margin:10px 0;min-height:1.2em}
#bd{--h:72px;--tk:62px}#bd.dense{--h:44px;--tk:38px}
.chip{display:inline-block;margin:6px;padding:8px 18px;border-radius:99px;background:var(--tc);font-size:1.4rem;font-weight:800}
.lane{margin:12px 0;padding:12px 16px;background:#1a2a4d;border-radius:16px}.dense .lane{margin:6px 0;padding:6px 14px}
.nm{display:flex;align-items:center;gap:10px;font-size:1.4rem;font-weight:800;margin-bottom:4px}.dense .nm{font-size:1rem}
.dot{width:14px;height:14px;border-radius:50%;background:var(--tc)}.you{display:none}
.trk{position:relative;height:var(--h)}
.cells{display:flex;gap:4px;align-items:center;height:100%}
.c{flex:1;height:calc(var(--h)*.5);border-radius:10px;background:#26365a;display:grid;place-items:center;font-size:calc(var(--h)*.36)}
.c.pass{background:var(--tc)}
.tok{position:absolute;top:50%;width:var(--tk);height:var(--tk);margin-top:calc(var(--tk)/-2);transform:translateX(-50%);border-radius:50%;background:var(--tc);color:#fff;border:3px solid #fff;display:grid;place-items:center;font-style:normal;font-weight:900;font-size:calc(var(--tk)*.5);transition:left .7s cubic-bezier(.3,1.5,.5,1);animation:pulse 1.5s infinite}
.tok.done{background:#f2b01e;animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--tc)}100%{box-shadow:0 0 0 16px transparent}}
#fin h2{font-size:2.4rem}.note{font-size:1.2rem;opacity:.8}
.row{display:flex;gap:24px;font-weight:800;padding:10px 16px;background:#1a2a4d;border-radius:14px;margin:8px 0}.row span:nth-child(2){flex:1}
.ctl{margin-top:22px}button{font:inherit;font-size:1.3rem;font-weight:800;padding:14px 30px;border:0;border-radius:14px;background:#2f5fa8;color:#fff}
#rs,#dm{background:#4a5675;font-size:1rem;margin-left:12px}
</style></head><body><div class="w">
<div class="hd"><h1>チーム戦クイズ(テスト用)</h1><span id="st"></span></div>
<div id="lobby"><div id="qr"></div><p id="url"></p><p class="mid">QRコードを読み取って、チーム名を入力しよう!</p><div id="chips"></div></div>
<div id="play" style="display:none"><div id="el"></div><div id="goal"></div><div id="bd"></div></div>
<div id="fin" style="display:none"></div>
<div class="ctl"><button id="main"></button><button id="rs">最初からやり直す</button><button id="dm" style="display:none">テスト用にチームを6つ追加</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getDatabase,ref,set,update,remove,onValue,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const cfg={apiKey:"AIzaSyD4hOMWOfEy-RmuIMYCH8fI3tXvNijKjgI",authDomain:"quiz-competition-f04d6.firebaseapp.com",databaseURL:"https://quiz-competition-f04d6-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"quiz-competition-f04d6",appId:"1:272062892984:web:359306a22f7cb27de25d4d"};
const TEST=true,LOCK=30;
// ▼ 問題はここだけ書き換える(t=問題文、a=正解として認める答えの一覧。ひらがな・カタカナ・全角半角・空白の違いは自動で同じ扱い)
const Q=[
{t:"テスト問題1:日本の首都は?",a:["東京","とうきょう","東京都"]},
{t:"テスト問題2:1週間は何日?(数字で)",a:["7","7日","七","七日"]},
{t:"テスト問題3:晴れた日の空の色は?",a:["青","あお","青色","あおいろ"]},
{t:"テスト問題4:1年は何か月?(数字で)",a:["12","12か月","十二"]},
{t:"テスト問題5:犬の鳴き声は?",a:["わん","わんわん"]},
{t:"テスト問題6:3+4は?",a:["7","七"]},
{t:"テスト問題7:世界で一番大きな海は?",a:["太平洋","たいへいよう"]},
{t:"テスト問題8:富士山があるのは静岡県と何県?",a:["山梨","山梨県","やまなし","やまなしけん"]},
{t:"テスト問題9:信号で「進め」を表す色は?",a:["青","あお","緑","みどり","青色"]},
{t:"テスト問題10:サッカーは1チーム何人?(数字で)",a:["11","11人","十一","十一人"]}];
const db=getDatabase(initializeApp(cfg)),$=i=>document.getElementById(i);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
const mmss=ms=>{const s=Math.max(0,Math.round(ms/1000));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const N0=10;
const ranked=T=>Object.keys(T).map(k=>({k,...T[k]})).sort((a,b)=>(b.q||0)-(a.q||0)||(a.at||0)-(b.at||0));
function renderBoard(el,T,me,N){
 [...el.children].forEach(c=>{if(!T[c.dataset.k])c.remove()});
 Object.keys(T).sort().forEach((k,i)=>{
  const t=T[k],q=Math.min(t.q||0,N),pos=((q+.5)/(N+1)*100)+"%";let L=[...el.children].find(c=>c.dataset.k===k);
  if(!L){L=document.createElement("div");L.className="lane";L.dataset.k=k;
   L.innerHTML='<div class="nm"><i class="dot"></i><span class="t"></span><b class="you">あなた</b></div><div class="trk"><div class="cells">'+'<div class="c"></div>'.repeat(N+1)+'</div><i class="tok"></i></div>';
   L.querySelector(".tok").style.left=pos;el.appendChild(L)}
  L.style.setProperty("--tc","hsl("+hue(t.name)+" 65% 45%)");L.classList.toggle("me",k===me);L.querySelector(".t").textContent=t.name;
  L.querySelectorAll(".c").forEach((c,j)=>{c.classList.toggle("pass",j<q);c.textContent=j===0?"🚩":j===N?"🏁":""});
  const tk=L.querySelector(".tok");tk.style.left=pos;tk.classList.toggle("done",q>=N);tk.textContent=q>=N?"🏆":[...t.name][0];
  if(el.children[i]!==L)el.insertBefore(L,el.children[i]||null)})}
const NOTE="順位は、先に進んだチームが上位。同じ進み具合のときは、先にそこへ着いたチームが上位です。";

const norm=s=>String(s).normalize("NFKC").toLowerCase().replace(/[\s・、。,.\-ー]/g,"").replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-96));
let g={phase:"lobby"},T={},off=0,done={},first=true,ended=false;
const url=location.href.replace(/[^/]*$/,"player.html");
$("url").textContent=url;new QRCode($("qr"),{text:url,width:240,height:240});
onValue(ref(db,".info/serverTimeOffset"),s=>off=s.val()||0);
onValue(ref(db,"game"),s=>{g=s.val()||{};if(g.phase!=="play"&&g.phase!=="end")g={phase:"lobby",epoch:g.epoch||0};ui()});
onValue(ref(db,"teams"),s=>{T=s.val()||{};ui()});
onValue(ref(db,"tries"),s=>{const R=s.val()||{};
 if(first){first=false;for(const k in R)done[k]=R[k].n;return}
 for(const k in R)if(done[k]!==R[k].n){done[k]=R[k].n;judge(k,R[k])}});
async function judge(id,t){
 const m=T[id],now=Date.now()+off;
 if(!m||g.phase!=="play"||(m.lock||0)>now||(m.q||0)>=Q.length||t.q!==(m.q||0))return;
 const ok=Q[m.q||0].a.map(norm).includes(norm(t.text||"")),u={res:{n:t.n,ok}};
 if(ok){u.q=(m.q||0)+1;u.at=serverTimestamp()}else u.lock=now+LOCK*1000;
 await update(ref(db,"teams/"+id),u);
}
const start=()=>Object.keys(T).length&&set(ref(db,"game"),{phase:"play",epoch:g.epoch||0,startedAt:serverTimestamp(),lock:LOCK,qs:Q.map(x=>x.t)});
const endGame=()=>update(ref(db,"game"),{phase:"end"});
async function reset(){done={};ended=false;await set(ref(db,"game"),{phase:"lobby",epoch:Date.now()});await remove(ref(db,"tries"));await remove(ref(db,"teams"));await remove(ref(db,"players"));await remove(ref(db,"answers"))}
$("rs").onclick=()=>{if(confirm("チームと進み具合をすべて消して、最初に戻します。よろしいですか?"))reset()};
if(TEST){$("dm").style.display="";
 $("dm").onclick=async()=>{for(let i=1;i<=6;i++)await set(ref(db,"teams/dummy"+i),{name:"テスト"+"ABCDEF"[i-1],q:0,lock:0})};
 setInterval(()=>{if(g.phase!=="play")return;for(const k in T)if(k.startsWith("dummy")&&(T[k].q||0)<Q.length&&Math.random()<.3)update(ref(db,"teams/"+k),{q:(T[k].q||0)+1,at:serverTimestamp()})},2000)}
setInterval(()=>{if(g.phase==="play")$("el").textContent="経過 "+mmss(Date.now()+off-g.startedAt)},1000);
function ui(){
 const ph=g.phase,ids=Object.keys(T).sort();
 $("st").textContent="参加チーム "+ids.length;
 $("lobby").style.display=ph==="lobby"?"":"none";$("play").style.display=ph==="play"?"":"none";$("fin").style.display=ph==="end"?"":"none";
 $("chips").innerHTML=ids.map(k=>'<span class="chip" style="--tc:hsl('+hue(T[k].name)+' 65% 45%)">'+esc(T[k].name)+"</span>").join("");
 if(ph==="play"){
  $("bd").className=ids.length>6?"dense":"";renderBoard($("bd"),T,"",Q.length);
  $("goal").innerHTML=ids.filter(k=>(T[k].q||0)>=Q.length).sort((a,b)=>(T[a].at||0)-(T[b].at||0)).map((k,i)=>["🥇","🥈","🥉"][i]+" "+esc(T[k].name)+" "+mmss((T[k].at||0)-g.startedAt)).join("　　");
  if(ids.length&&ids.every(k=>(T[k].q||0)>=Q.length)&&!ended){ended=true;endGame()}}
 if(ph==="end"){const L=ranked(T),fs=L.length>12?1.2:L.length>6?1.6:2;
  $("fin").innerHTML="<h2>最終結果</h2><p class=note>"+NOTE+"</p>"+L.map((t,i)=>'<div class="row" style="font-size:'+fs+'rem"><span>'+(i+1)+"位</span><span>"+esc(t.name)+"</span><span>"+((t.q||0)>=Q.length?"ゴール "+mmss(t.at-g.startedAt):(t.q||0)+"問クリア")+"</span></div>").join("")}
 const[label,fn]={lobby:["ゲーム開始",start],play:["結果発表",endGame],end:["最初からやり直す",reset]}[ph];
 $("main").textContent=label;$("main").onclick=fn;
}
ui();
</script></body></html>
