<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>チーム戦クイズ</title>
<style>
:root{--ink:#172033;--bg:#eef2f9;--card:#fff;--b:#2f5fa8}
@media(prefers-color-scheme:dark){:root{--ink:#eef2f9;--bg:#0f1824;--card:#1b2838}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:14px;padding-top:max(14px,env(safe-area-inset-top));padding-bottom:max(30px,env(safe-area-inset-bottom));font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink)}
.pill{display:inline-block;background:var(--b);color:#fff;border-radius:99px;padding:6px 16px;font-size:1.2rem;font-weight:800}
.card{background:var(--card);border-radius:20px;padding:20px;margin:12px 0;box-shadow:0 2px 10px rgba(0,0,0,.1);font-size:1.5rem;font-weight:800;line-height:1.5}
input{width:100%;font:inherit;font-size:1.4rem;padding:16px;border-radius:16px;border:2px solid var(--b);background:var(--card);color:var(--ink)}
.btn{width:100%;margin-top:10px;padding:18px;border:0;border-radius:18px;background:var(--b);color:#fff;font:inherit;font-size:1.4rem;font-weight:800}
.btn:disabled{opacity:.4}
.msg{border-radius:16px;padding:12px;margin:10px 0;text-align:center;font-weight:800;font-size:1.3rem;color:#fff;background:#2f8a52}
.lock{background:#c8433f;color:#fff;border-radius:22px;padding:20px;text-align:center;margin:12px 0;font-weight:800;font-size:1.2rem}
.lock .big{font-size:4.5rem;font-weight:900;line-height:1.1}
.bar{height:14px;border-radius:9px;background:rgba(255,255,255,.35);margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:#fff;transition:width .2s linear}
.sub{text-align:center;opacity:.8;font-size:1.05rem}
h2{font-size:1.1rem;margin:26px 0 6px}
.lane{margin:8px 0;padding:8px 10px;background:var(--card);border-radius:14px}.lane.me{outline:3px solid var(--b)}
.nm{font-size:.95rem;font-weight:800;margin-bottom:4px}
.trk{display:flex;gap:2px;align-items:center}
.c{flex:1;height:30px;border-radius:6px;background:rgba(127,127,127,.25);display:grid;place-items:center;font-size:.8rem}
.c.pass{background:var(--tc);opacity:.55}
.tok{width:30px;height:30px;border-radius:50%;background:var(--tc);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:900;font-size:.9rem;box-shadow:0 0 0 3px var(--card)}
</style></head><body><div id="main"></div><div id="bd"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getDatabase,ref,set,onValue}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const cfg={apiKey:"AIzaSyD4hOMWOfEy-RmuIMYCH8fI3tXvNijKjgI",authDomain:"quiz-competition-f04d6.firebaseapp.com",databaseURL:"https://quiz-competition-f04d6-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"quiz-competition-f04d6",appId:"1:272062892984:web:359306a22f7cb27de25d4d"};
const db=getDatabase(initializeApp(cfg)),$=i=>document.getElementById(i);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
const mmss=ms=>{const s=Math.max(0,Math.round(ms/1000));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const N0=10;
const ranked=T=>Object.keys(T).map(k=>({k,...T[k]})).sort((a,b)=>(b.q||0)-(a.q||0)||(a.at||0)-(b.at||0));
const board=(T,me,N)=>Object.keys(T).sort().map(k=>{const t=T[k],q=Math.min(t.q||0,N);let c="";
 for(let i=0;i<=N;i++)c+='<div class="c'+(i<q?" pass":"")+'">'+(i===q?'<i class="tok">'+esc([...t.name][0])+"</i>":i===N?"🏁":i===0?"🚩":"")+"</div>";
 return '<div class="lane'+(k===me?" me":"")+'" style="--tc:hsl('+hue(t.name)+' 65% 45%)"><div class="nm">'+esc(t.name)+(q>=N?" 🏆":"")+'</div><div class="trk">'+c+"</div></div>"}).join("");
const NOTE="順位は、先に進んだチームが上位。同じ進み具合のときは、先にそこへ着いたチームが上位です。";

let id,name,off=0,g={phase:"lobby"},T={},lastSig="",lastRes=0;
try{id=localStorage.tid;name=localStorage.tname}catch(e){}
function watch(){onValue(ref(db,"teams/"+id),s=>{if(!s.exists())set(ref(db,"teams/"+id),{name,q:0,lock:0})})}
if(id&&name)watch();
onValue(ref(db,".info/serverTimeOffset"),s=>off=s.val()||0);
onValue(ref(db,"game"),s=>{g=s.val()||{};if(g.phase!=="play"&&g.phase!=="end")g={phase:"lobby"};update()});
onValue(ref(db,"teams"),s=>{T=s.val()||{};update()});
function update(){
 const m=T[id]||{q:0,lock:0},locked=(m.lock||0)>Date.now()+off,N=(g.qs||[]).length||N0;
 const sig=[name,g.phase,g.phase==="end"?Object.keys(T).length:0,m.q||0,locked,m.res?m.res.n:0].join("|");
 if(sig!==lastSig){lastSig=sig;main(m,locked,N)}
 $("bd").innerHTML=Object.keys(T).length?"<h2>みんなの進み具合</h2>"+board(T,id,N):"";
}
function send(){const t=$("an").value.trim();if(!t)return;set(ref(db,"tries/"+id),{n:Date.now(),q:(T[id]||{}).q||0,text:t});$("an").value="";$("sb").disabled=true;setTimeout(()=>{if($("sb"))$("sb").disabled=false},1500)}
function main(m,locked,N){
 const M=$("main"),q=m.q||0;
 if(!name){M.innerHTML='<div class="card" style="text-align:center">チーム名を入力してください</div><input id="n" maxlength="12" placeholder="チーム名"><button class="btn" id="go">参加する</button>';
  $("go").onclick=()=>{name=$("n").value.trim();if(!name)return;id="t"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
   try{localStorage.tid=id;localStorage.tname=name}catch(e){}set(ref(db,"teams/"+id),{name,q:0,lock:0});watch();lastSig="";update()};return}
 if(g.phase==="lobby"){M.innerHTML='<div class="card" style="text-align:center">'+esc(name)+'<br>参加OK!</div><p class="sub">開始までお待ちください</p>';return}
 if(g.phase==="end"){M.innerHTML='<div class="card" style="text-align:center">最終結果</div><p class="sub">'+NOTE+"</p>"+ranked(T).map((t,i)=>'<div class="card" style="font-size:1.15rem;padding:12px 16px'+(t.k===id?";outline:4px solid var(--b)":"")+'"><div style="display:flex;gap:10px"><span>'+(i<3?["🥇","🥈","🥉"][i]:(i+1)+"位")+'</span><span style="flex:1">'+esc(t.name)+'</span></div><div style="font-size:.95rem;font-weight:600;opacity:.75">'+((t.q||0)>=N?"ゴール "+mmss(t.at-g.startedAt):(t.q||0)+"問クリア")+"</div></div>").join("");return}
 if(q>=N){M.innerHTML='<div class="msg" style="font-size:1.9rem;padding:26px">ゴール!🎉</div><p class="sub">ほかのチームの結果発表を待ってね</p>';return}
 const r=m.res;let strip="";if(r&&r.n!==lastRes){lastRes=r.n;if(r.ok)strip='<div class="msg">正解!次の問題へ</div>'}
 M.innerHTML=strip+'<span class="pill">第'+(q+1)+"問 / "+N+'</span><div class="card">'+esc(g.qs[q])+"</div>"+
  (locked?'<div class="lock">不正解…<div class="big" id="lk"></div>秒後にもう一度答えられます<div class="bar"><i id="lb"></i></div></div>':'<input id="an" placeholder="答えを入力" autocomplete="off"><button class="btn" id="sb">回答する</button>');
 if(!locked){$("sb").onclick=send;$("an").onkeydown=e=>{if(e.key==="Enter")send()}}
}
setInterval(()=>{const m=T[id];if(!m||!$("lk"))return;const l=((m.lock||0)-(Date.now()+off))/1000;if(l<=0){update();return}$("lk").textContent=Math.ceil(l);$("lb").style.width=Math.min(100,100*l/(g.lock||30))+"%"},200);
update();
</script></body></html>
