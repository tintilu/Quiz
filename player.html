<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>クイズ大会</title>
<style>
:root{--bg:#f3f6fb;--t:#17212e;--b:#2f5fa8}
@media(prefers-color-scheme:dark){:root{--bg:#121c28;--t:#eaf1f9;--b:#7aa6e6}}
body{margin:0;padding:16px;font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--t);text-align:center}
h1{font-size:1.25rem;margin:8px 0 16px}
#q{font-size:1.25rem;font-weight:700;margin:10px 0 16px;line-height:1.5}
#tm{font-size:2.4rem;font-weight:800}
input,button{font:inherit;font-size:1.1rem;width:100%;box-sizing:border-box;padding:16px;margin:6px 0;border-radius:14px;border:2px solid var(--b)}
button{color:#fff;font-weight:700;background:var(--b);min-height:64px;text-align:left}
button:disabled{opacity:.45}
.c0{background:#c8433f}.c1{background:#2f5fa8}.c2{background:#b98512}.c3{background:#2f8a52}
.big{font-size:1.6rem;font-weight:800;margin:14px 0}
</style></head><body>
<h1>クイズ大会</h1><div id="v"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getDatabase,ref,set,onValue,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
// ▼ FirebaseのfirebaseConfigをここに貼る
const cfg={apiKey:"AIzaSyD4hOMWOfEy-RmuIMYCH8fI3tXvNijKjgI",authDomain:"quiz-competition-f04d6.firebaseapp.com",databaseURL:"https://quiz-competition-f04d6-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"quiz-competition-f04d6",appId:"1:272062892984:web:359306a22f7cb27de25d4d"};
const db=getDatabase(initializeApp(cfg)),v=document.getElementById("v");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let id,name,off=0,g={phase:"lobby"},done=-1,tm;
try{id=localStorage.qid;name=localStorage.qname}catch(e){}
function watch(){onValue(ref(db,"players/"+id),s=>{if(!s.exists())set(ref(db,"players/"+id),{name})})}
if(id&&name)watch();
onValue(ref(db,".info/serverTimeOffset"),s=>off=s.val()||0);
onValue(ref(db,"game"),s=>{g=s.val()||{phase:"lobby"};if(g.phase==="lobby")done=-1;render()});
function render(){
 clearInterval(tm);
 if(!name){v.innerHTML='<input id="n" maxlength="12" placeholder="ニックネーム"><button id="go" style="text-align:center">参加する</button>';
  go.onclick=()=>{name=n.value.trim();if(!name)return;id="p"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
   try{localStorage.qid=id;localStorage.qname=name}catch(e){}set(ref(db,"players/"+id),{name});watch();render()};return}
 const me=(g.board||[]).findIndex(b=>b.id===id),b=g.board&&g.board[me];
 if(g.phase==="question"){
  const ans=done===g.q;
  v.innerHTML='<div id="tm"></div><div id="q">'+esc(g.question.text)+"</div>"+
   g.question.choices.map((c,i)=>'<button class="c'+i+'" data-i="'+i+'"'+(ans?" disabled":"")+">"+"ABCD"[i]+". "+esc(c)+"</button>").join("")+
   (ans?'<p class="big">回答しました</p>':"");
  v.querySelectorAll("button").forEach(x=>x.onclick=()=>{done=g.q;set(ref(db,"answers/"+g.q+"/"+id),{c:+x.dataset.i,at:serverTimestamp()});render()});
  const tick=()=>{const l=Math.ceil(g.limit-(Date.now()+off-g.startedAt)/1000);tm_.textContent=l>0?l:"終了";if(l<=0)v.querySelectorAll("button").forEach(x=>x.disabled=true)};
  const tm_=document.getElementById("tm");tick();tm=setInterval(tick,250);
 }else if(g.phase==="reveal"){
  v.innerHTML='<div class="big">'+(b&&b.hit?"正解!":"残念…")+"</div><p>"+(b?"+"+b.gain+"点 / 合計 "+b.total+"点<br>現在 "+(me+1)+"位":"")+"</p><p>正解:"+"ABCD"[g.correct]+". "+esc(g.question.choices[g.correct])+"</p>";
 }else if(g.phase==="final"){
  v.innerHTML='<div class="big">最終結果</div>'+(g.board||[]).slice(0,3).map((x,i)=>"<p>"+(i+1)+"位 "+esc(x.name)+"("+x.total+"点)</p>").join("")+(b?'<p class="big">あなたは '+(me+1)+"位</p>":"");
 }else v.innerHTML='<p class="big">'+esc(name)+" さん、参加OK</p><p>開始までお待ちください</p>";
}
render();
</script></body></html>
